name: Scrape AliExpress

on:
  schedule:
    - cron: '0 8 * * *'        # Tous les jours à 8h UTC
  workflow_dispatch:           # Permet de lancer manuellement

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'           # ou 'pnpm'

      - name: Install dependencies
        run: npm ci               # ou pnpm install --frozen-lockfile

      - name: Run scraper
        run: node scrape.js
        env:
          # Ajoute des variables si besoin (ex: webhook Discord, API keys)
          PRODUCT_ID: ${{ vars.PRODUCT_ID }}
          # ou utilise des secrets pour des tokens sensibles

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-results
          path: |
            product.json
            *.log

      # Exemple : Push du JSON mis à jour sur une branche
      - name: Commit & Push results
        if: always()
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add product.json
          git commit -m "Update scraped product data" || echo "No changes"
          git push
